{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · TeamHub</title>
  <link rel="stylesheet" href="{% static 'css/variables.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/pages.css' %}">
  <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body class="auth">
  <main class="auth__card card">
    <h1>Welcome back</h1>
    <p class="muted">Log in with the account your admin created for you.</p>

    <!-- DJANGO: Django's LoginView provides "form" -->
    {% if form.errors %}
    <p class="form-error" role="alert">That username and password don't match. Check both and try again.</p>
    {% endif %}

    <form method="post" action="/accounts/login/">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
